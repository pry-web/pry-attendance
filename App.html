<script>
const VIEW_NAMES = ['dashboard','events','participants','sessions','scanner','reports','settings'];
const SAVED_VIEW = localStorage.getItem('pry.activeView');
const APP = {
  events: [], activeEventId: localStorage.getItem('pry.activeEventId') || null,
  participants: [], currentView: VIEW_NAMES.includes(SAVED_VIEW) ? SAVED_VIEW : 'dashboard', bootstrap: null,
  scanner: null, scannerRunning: false, lastScan: '', lastScanAt: 0,
  localRecent: [], queueDb: null, dashboardPrefetch: null, sessionCatalog: [], sessionsLoaded: false,
};
const IS_LOCAL = Boolean(window.PRY_LOCAL_MODE);
const CAN_USE_LIVE_CAMERA = IS_LOCAL || Boolean(window.PRY_EXTERNAL_HOST);
const DATA_SOURCE = IS_LOCAL ? 'local XLSX spreadsheet' : 'Google Sheets';
const PAGE_TITLES = {dashboard:'Dashboard',events:'Events',participants:'Participants',sessions:'Sessions',scanner:'Attendance Scanner',reports:'Reports',settings:'System & Sync'};
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const BOOTSTRAP_SNAPSHOT_KEY = 'pry.bootstrapSnapshot.v1', BOOTSTRAP_SNAPSHOT_MAX_AGE = 120000;
const safe = (v='')=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const pct=(a,b)=>b?`${((a/b)*100).toFixed(1)}%`:'0.0%';
const slug=s=>String(s||'PRY_Camp').trim().replace(/[^a-z0-9]+/gi,'_').replace(/^_|_$/g,'');
function fmtDate(v){ if(!v)return '—'; const d=new Date(`${String(v).slice(0,10)}T00:00:00`); return isNaN(d)?String(v):d.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}); }
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('opacity-0','translate-y-[-8px]');el.classList.add('opacity-100','translate-y-0');clearTimeout(toast.t);toast.t=setTimeout(()=>{el.classList.remove('opacity-100','translate-y-0');el.classList.add('opacity-0','translate-y-[-8px]');},2400);}

function gas(fn,...args){
  if(window.PRY_PREVIEW_API && typeof window.PRY_PREVIEW_API[fn]==='function') return Promise.resolve().then(()=>window.PRY_PREVIEW_API[fn](...args));
  return new Promise((resolve,reject)=>{
    try{
      const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err?.message||String(err))));
      runner[fn](...args);
    }catch(err){reject(err);}
  });
}

function activeEvent(){return APP.events.find(e=>e.eventId===APP.activeEventId)||null;}
function groupLabel(e=activeEvent()){return e?.type==='NPRY'?'District':'Church';}
function eventDays(e=activeEvent()){
  if(!e)return[];const a=new Date(`${e.startDate}T00:00:00`),b=new Date(`${e.endDate}T00:00:00`),out=[];let day=1;
  for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))out.push({day:day++,date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`});return out;
}
function currentDay(e=activeEvent()){const ds=eventDays(e);if(!ds.length)return 1;const n=Math.floor((new Date()-new Date(`${e.startDate}T00:00:00`))/86400000)+1;return Math.max(1,Math.min(ds.length,n));}
function qrCodeFromRaw(raw){const s=String(raw||'').trim();if(s.startsWith('PRY|'))return s.split('|')[2]||'';return s;}

// ---------- IndexedDB pending scan queue ----------
function openQueueDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('pryOnlineAttendanceQueue',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('pending'))db.createObjectStore('pending',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function qStore(mode='readonly'){return APP.queueDb.transaction('pending',mode).objectStore('pending');}
function qPut(v){return new Promise((res,rej)=>{const r=qStore('readwrite').put(v);r.onsuccess=()=>res(v);r.onerror=()=>rej(r.error);});}
function qDelete(id){return new Promise((res,rej)=>{const r=qStore('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function qAll(){return new Promise((res,rej)=>{const r=qStore().getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
async function refreshPendingUI(){const q=APP.queueDb?await qAll():[],pending=$('#pendingSidebar');if(pending)pending.textContent=q.length;const badge=$('#syncBadge');if(!badge)return;if(q.length){badge.className='badge warning';badge.textContent=`${q.length} Pending`;}else{badge.className='badge success';badge.textContent=IS_LOCAL?'● Local':navigator.onLine?'● Synced':'● Offline';}}
async function queueScan(payload){const code=qrCodeFromRaw(payload.raw||payload.participantCode);const key=`${payload.eventId}|${code}|${payload.day}|${payload.session}`;const all=await qAll();if(all.some(x=>x.key===key))return{duplicate:true};const item={id:`Q-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,key,payload:{...payload,participantCode:code,raw:payload.raw||code},queuedAt:new Date().toISOString()};await qPut(item);await refreshPendingUI();return{duplicate:false,item};}
async function syncPending(showToast=true){if(!navigator.onLine&&!IS_LOCAL){if(showToast)toast('Still offline. Pending scans are safe on this device.');return;}const items=await qAll();if(!items.length){if(showToast)toast('No pending scans to sync.');await refreshPendingUI();return;}try{const results=await gas('syncPendingAttendance',items.map(x=>x.payload));for(const r of results){if(r.ok)await qDelete(items[r.index].id);}await refreshPendingUI();if(showToast)toast(`Sync complete: ${results.filter(r=>r.ok).length} processed.`);if(APP.currentView==='dashboard')renderDashboard();}catch(err){if(showToast)toast(`Sync failed: ${err.message}`);}}

function updateConnection(){const on=navigator.onLine||IS_LOCAL,dot=$('#connectionDot'),label=$('#connectionLabel');if(dot)dot.className=`h-2 w-2 rounded-full ${on?'bg-emerald-400':'bg-amber-400'}`;if(label)label.lastChild.textContent=IS_LOCAL?'Local':on?'Online':'Offline';refreshPendingUI();if(on)syncPending(false);}
window.addEventListener('online',updateConnection);window.addEventListener('offline',updateConnection);

// ---------- Navigation ----------
function applyBootstrapBundle(bundle){APP.bootstrap=bundle;APP.events=bundle.events||[];APP.activeEventId=bundle.activeEventId||null;APP.participants=bundle.participants||[];APP.dashboardPrefetch=bundle.dashboard||null;APP.sessionCatalog=bundle.sessions||[];APP.sessionsLoaded=Array.isArray(bundle.sessions);localStorage.setItem('pry.activeEventId',APP.activeEventId||'');}
function saveBootstrapSnapshot(bundle){if(IS_LOCAL||!bundle)return;try{sessionStorage.setItem(BOOTSTRAP_SNAPSHOT_KEY,JSON.stringify({savedAt:Date.now(),bundle}));}catch{}}
function readBootstrapSnapshot(){if(IS_LOCAL)return null;try{const snapshot=JSON.parse(sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY)||'null');return snapshot&&Date.now()-Number(snapshot.savedAt)<BOOTSTRAP_SNAPSHOT_MAX_AGE&&snapshot.bundle?snapshot.bundle:null;}catch{return null;}}
async function loadBootstrap(){if(!IS_LOCAL){const options={includeDashboard:APP.currentView==='dashboard'},cached=readBootstrapSnapshot();if(cached){applyBootstrapBundle(cached);refreshEventSelect();gas('bootstrapApp',APP.activeEventId,options).then(bundle=>{applyBootstrapBundle(bundle);saveBootstrapSnapshot(bundle);refreshEventSelect();renderCurrent();}).catch(error=>toast(`Live refresh delayed: ${error.message}`));return;}const bundle=await gas('bootstrapApp',APP.activeEventId,options);applyBootstrapBundle(bundle);saveBootstrapSnapshot(bundle);}else{APP.bootstrap=await gas('bootstrap');APP.events=APP.bootstrap.events||[];if(!APP.events.some(e=>e.eventId===APP.activeEventId))APP.activeEventId=APP.events.find(e=>e.status==='ACTIVE')?.eventId||APP.events[0]?.eventId||null;await refreshParticipants();localStorage.setItem('pry.activeEventId',APP.activeEventId||'');}refreshEventSelect();}
async function refreshParticipants(){APP.dashboardPrefetch=null;APP.participants=APP.activeEventId?await gas('getParticipants',APP.activeEventId):[];if(!IS_LOCAL)saveBootstrapSnapshot({...APP.bootstrap,events:APP.events,activeEventId:APP.activeEventId,participants:APP.participants,dashboard:null});}
function refreshEventSelect(){const sel=$('#activeEventSelect');const list=APP.events.filter(e=>e.status!=='ARCHIVED');sel.innerHTML=list.length?list.map(e=>`<option value="${e.eventId}" ${e.eventId===APP.activeEventId?'selected':''}>${safe(e.name)} · ${e.type}</option>`).join(''):'<option>No active event</option>';sel.disabled=!list.length;}
async function setActiveEvent(id){APP.dashboardPrefetch=null;APP.activeEventId=id||null;if(!IS_LOCAL){const bundle=await gas('bootstrapApp',APP.activeEventId,{includeDashboard:APP.currentView==='dashboard'});applyBootstrapBundle(bundle);saveBootstrapSnapshot(bundle);}else{await refreshParticipants();localStorage.setItem('pry.activeEventId',APP.activeEventId||'');}refreshEventSelect();await renderCurrent();}
async function showView(name){name=VIEW_NAMES.includes(name)?name:'dashboard';if(APP.currentView==='scanner'&&name!=='scanner')await stopScanner();APP.currentView=name;localStorage.setItem('pry.activeView',name);$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));let activeNav=null;$$('.nav-item').forEach(b=>{const on=b.dataset.view===name;b.classList.toggle('bg-white/10',on);b.classList.toggle('text-white',on);b.classList.toggle('text-slate-300',!on);b.setAttribute('aria-current',on?'page':'false');if(on&&b.closest('#nav'))activeNav=b;});if(activeNav&&window.innerWidth<1024)activeNav.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});$('#pageTitle').textContent=PAGE_TITLES[name];await renderCurrent();window.scrollTo({top:0,behavior:'smooth'});}
async function renderCurrent(){const fn={dashboard:renderDashboard,events:renderEvents,participants:renderParticipants,sessions:renderSessions,scanner:renderScanner,reports:renderReports,settings:renderSettings}[APP.currentView];await fn();}
function emptyEvent(){return `<div class="card empty"><div class="icon">◆</div><strong>Create a PRY camp event</strong><p>Choose DPRY for Church-based attendance or NPRY for District-based attendance. ${IS_LOCAL?'A local XLSX workbook stores your test data.':'Google Drive and Sheets are created automatically.'}</p><button class="btn primary" data-create-event>Create Event</button></div>`;}
function bindEmpty(root){root.querySelector('[data-create-event]')?.addEventListener('click',openEventModal);}

// ---------- Dashboard ----------
async function renderDashboard(){const root=$('#view-dashboard'),e=activeEvent();if(!e){root.innerHTML=emptyEvent();bindEmpty(root);return;}root.innerHTML=`<div class="card empty"><strong>Loading dashboard…</strong><p>Reading live attendance from ${DATA_SOURCE}.</p></div>`;try{const day=currentDay(e),prefetch=APP.dashboardPrefetch,canUsePrefetch=prefetch&&prefetch.event?.eventId===e.eventId&&Number(prefetch.selectedDay)===day,d=canUsePrefetch?prefetch:await gas('getDashboard',e.eventId,day);APP.dashboardPrefetch=null;root.innerHTML=`
<div class="event-hero">
 <div class="event-hero-copy"><div class="event-hero-kicker"><span class="event-live-dot"></span>${safe(e.type)} · ${safe(groupLabel(e))}-based registration</div><h2>${safe(e.name)}</h2><div class="event-meta"><span>${safe(e.venue||'Venue not set')}</span><span>${safe(fmtDate(e.startDate))} — ${safe(fmtDate(e.endDate))}</span><span>${IS_LOCAL?'Local XLSX mode':'Google Sheets mode'}</span></div></div>
 <div class="event-hero-actions"><button class="btn hero-secondary" data-go="participants">Manage Participants</button><button class="btn hero-primary" data-go="scanner">Start Scanning</button></div>
</div>
<div class="stats">
 <div class="card stat accent"><div class="stat-label">${safe(e.type)} Camp</div><div class="stat-value">Day ${d.selectedDay}</div><div class="stat-note">${safe(fmtDate(d.days[d.selectedDay-1]?.date))} · ${safe(groupLabel(e))}-based</div></div>
 <div class="card stat"><div class="stat-label">Registered</div><div class="stat-value">${d.registered}</div><div class="stat-note">Total delegates</div></div>
 <div class="card stat"><div class="stat-label">Attended Today</div><div class="stat-value">${d.attendedToday}</div><div class="stat-note">Unique participants</div></div>
 <div class="card stat"><div class="stat-label">Attendance Rate</div><div class="stat-value">${Number(d.attendanceRate).toFixed(1)}%</div><div class="stat-note">At least one session today</div></div>
</div>
<div class="grid-2">
 <div class="card card-pad"><div class="section-head"><div><h2>Attendance by ${safe(groupLabel(e))}</h2><p>Live Day ${d.selectedDay} unique attendance from all stations.</p></div><button class="btn small" data-go="reports">View report</button></div>
 ${d.groups.length?d.groups.map(g=>`<div class="progress-row"><div class="progress-name">${safe(g.group)}</div><div class="progress-track"><div class="progress-fill" style="width:${g.registered?(g.unique/g.registered*100):0}%"></div></div><div class="progress-value">${g.unique}/${g.registered}</div></div>`).join(''):`<div class="empty"><strong>No attendance yet</strong>Scan delegates to populate the live totals.</div>`}</div>
 <div class="card card-pad"><div class="section-head"><div><h2>Today's Sessions</h2><p>Unique scans per session.</p></div><span class="badge success">Live</span></div>
 ${Object.entries(d.sessions||{}).length?Object.entries(d.sessions).map(([session,count])=>`<div class="mini-metric"><span>${safe(session)}</span><strong>${count} / ${d.registered}</strong></div>`).join(''):`<div class="card-sub">No sessions recorded for this day yet.</div>`}
 <div class="mini-metric"><span>Total attendance rows</span><strong>${d.totalLogs}</strong></div>
 <div class="actions mt-4"><button class="btn primary" data-go="scanner">Open Scanner</button><a class="btn" href="${safe(e.spreadsheetUrl)}" target="_blank">${IS_LOCAL?'Download Local Workbook':'Open Google Sheet'}</a></div></div>
</div>`;$$('[data-go]',root).forEach(b=>b.onclick=()=>{if(b.dataset.go==='scanner')openScannerSessionModal();else showView(b.dataset.go);});}catch(err){root.innerHTML=`<div class="notice warning">${safe(err.message)}</div>`;}}

// ---------- Events ----------
async function renderEvents(){const root=$('#view-events');root.innerHTML=`<div class="section-head"><div><h2>Camp Events</h2><p>${IS_LOCAL?'Events are stored in the local development workbook.':'Each event receives its own Google Drive folder and Google Sheet database.'}</p></div><button class="btn primary" id="newEventBtn">+ New Event</button></div>
<div class="card">${APP.events.length?`<div class="table-wrap border-0"><table class="table"><thead><tr><th>Event</th><th>Type</th><th>Grouping</th><th>Dates</th><th>Status</th><th></th></tr></thead><tbody>${APP.events.map(e=>`<tr><td><strong>${safe(e.name)}</strong><div class="card-sub">${safe(e.venue||'No venue')}</div></td><td><span class="badge">${safe(e.type)}</span></td><td>${safe(groupLabel(e))}</td><td>${fmtDate(e.startDate)}<br><span class="card-sub">to ${fmtDate(e.endDate)}</span></td><td>${e.status==='ARCHIVED'?'<span class="badge neutral">Archived</span>':e.eventId===APP.activeEventId?'<span class="badge success">Active</span>':'<span class="badge">Available</span>'}</td><td class="right"><div class="actions justify-end">${e.status!=='ARCHIVED'?`<button class="btn small" data-use="${e.eventId}">Use</button><a class="btn small" target="_blank" href="${safe(e.spreadsheetUrl)}">Sheet</a><button class="btn small" data-archive="${e.eventId}">Archive</button>`:`<button class="btn small" data-restore="${e.eventId}">Restore</button>`}<button class="btn small danger" data-delete-event="${e.eventId}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No events yet</strong>Create your first DPRY or NPRY camp.</div>`}</div>`;$('#newEventBtn').onclick=openEventModal;$$('[data-use]',root).forEach(b=>b.onclick=()=>setActiveEvent(b.dataset.use));$$('[data-archive]',root).forEach(b=>b.onclick=()=>confirmArchive(b.dataset.archive));$$('[data-restore]',root).forEach(b=>b.onclick=async()=>{await gas('restoreEvent',b.dataset.restore);await loadBootstrap();renderEvents();toast('Event restored.');});$$('[data-delete-event]',root).forEach(b=>b.onclick=()=>confirmDeleteEvent(b.dataset.deleteEvent));}
function openEventModal(){const now=new Date(),today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,endD=new Date(now.getTime()+4*86400000),end=`${endD.getFullYear()}-${pad(endD.getMonth()+1)}-${pad(endD.getDate())}`;modal(`<div class="modal-head"><div><h2>Create Camp Event</h2><div class="card-sub">${IS_LOCAL?'The event will be added to your local XLSX workbook.':'Google Drive folder + Google Sheet are created automatically.'}</div></div><button class="icon-btn" data-close>✕</button></div><form id="eventForm"><div class="modal-body"><div class="form-grid"><div class="field span-2"><label class="form-label">Event Name</label><input name="name" required placeholder="e.g. NPRY 2027"></div><div class="field"><label class="form-label">Event Type</label><select name="type"><option value="DPRY">DPRY — Church</option><option value="NPRY">NPRY — District</option></select></div><div class="field"><label class="form-label">Venue</label><input name="venue" placeholder="Camp venue"></div><div class="field"><label class="form-label">Start Date</label><input type="date" name="startDate" value="${today}" required></div><div class="field"><label class="form-label">End Date</label><input type="date" name="endDate" value="${end}" required></div></div><div class="notice mt-4">DPRY stores only the participant's <b>Church</b>. NPRY stores only the participant's <b>District</b>.</div></div><div class="modal-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Create Event</button></div></form>`);$('#eventForm').onsubmit=async ev=>{ev.preventDefault();const obj=Object.fromEntries(new FormData(ev.target).entries());if(obj.endDate<obj.startDate){toast('End date must be after start date.');return;}const btn=ev.submitter;btn.disabled=true;btn.textContent='Creating…';try{const created=await gas('createEvent',obj);closeModal();await loadBootstrap();await setActiveEvent(created.eventId);showView('participants');toast(IS_LOCAL?'Event added to local workbook.':'Event and Google Sheet created.');}catch(err){btn.disabled=false;btn.textContent='Create Event';toast(err.message);}};}
function confirmArchive(id){const e=APP.events.find(x=>x.eventId===id);modal(`<div class="modal-head"><h2>Archive event?</h2><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="notice warning">This hides <b>${safe(e?.name)}</b> from the active event selector. Its Google Sheet and Drive folder are not deleted.</div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="archiveConfirm">Archive</button></div>`);$('#archiveConfirm').onclick=async()=>{await gas('archiveEvent',id);closeModal();await loadBootstrap();renderEvents();toast('Event archived.');};}
function confirmDeleteEvent(id){const e=APP.events.find(x=>x.eventId===id);modal(`<div class="modal-head"><h2>Delete event?</h2><button class="icon-btn" data-close>✕</button></div><div class="modal-body"><div class="notice warning"><b>${safe(e?.name||'This event')}</b> and all of its participants and attendance records will be removed.${IS_LOCAL?' This cannot be undone in local mode.':' Its Google Drive folder will be moved to Trash.'}</div><div class="field mt-4"><label class="form-label">Type DELETE to confirm</label><input id="deleteEventPhrase" autocomplete="off" placeholder="DELETE"></div></div><div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn danger" id="deleteEventConfirm" disabled>Delete Event</button></div>`);const input=$('#deleteEventPhrase'),button=$('#deleteEventConfirm');input.oninput=()=>button.disabled=input.value.trim()!=='DELETE';input.focus();button.onclick=async()=>{button.disabled=true;button.textContent='Deleting…';try{await gas('deleteEvent',id);closeModal();await loadBootstrap();renderEvents();toast('Event deleted.');}catch(err){button.disabled=false;button.textContent='Delete Event';toast(err.message);}};}

// ---------- Participants + Excel ----------
async function renderParticipants(){const root=$('#view-participants'),e=activeEvent();if(!e){root.innerHTML=emptyEvent();bindEmpty(root);return;}if(!APP.participants.length)await refreshParticipants();const p=APP.participants;root.innerHTML=`<div class="section-head"><div><h2>Participants</h2><p>${e.type} mode: participant grouping is only by <b>${groupLabel(e)}</b>.</p></div><div class="actions no-print"><button class="btn" id="templateBtn">Download Excel Template</button><button class="btn" id="importBtn">Import Excel</button><button class="btn primary" id="addParticipantBtn">+ Add Participant</button></div></div>
<div class="stats"><div class="card stat"><div class="stat-label">Participants</div><div class="stat-value">${p.length}</div><div class="stat-note">${IS_LOCAL?'Local workbook roster':'Live Google Sheet roster'}</div></div><div class="card stat"><div class="stat-label">${groupLabel(e)}s</div><div class="stat-value">${new Set(p.map(x=>x.group)).size}</div><div class="stat-note">Unique groups</div></div><div class="card stat"><div class="stat-label">QR Ready</div><div class="stat-value">${p.length}</div><div class="stat-note">Unique QR per participant</div></div><div class="card stat"><div class="stat-label">Database</div><div class="stat-value !text-[23px]">${IS_LOCAL?'XLSX':'Sheets'}</div><div class="stat-note">${IS_LOCAL?'Local offline':'Shared online'}</div></div></div>
<div class="card card-pad no-print"><div class="section-head"><div><h2>Participant Roster</h2><p>Imported or added participants are immediately available to all attendance stations.</p></div><div class="actions"><button class="btn danger" id="deleteSelectedParticipants" disabled>Delete Selected <span class="selection-count" id="selectedParticipantsCount">0</span></button><button class="btn" id="refreshParticipants">Refresh</button><button class="btn" id="nameTagsBtn">Name Tags</button><a class="btn" href="${safe(e.spreadsheetUrl)}" target="_blank">Open Sheet</a></div></div>${p.length?`<div class="table-wrap"><table class="table"><thead><tr><th class="select-cell"><label class="select-all-control"><input type="checkbox" id="markAllParticipants"><span>Mark All</span></label></th><th>ID</th><th>Full Name</th><th>${groupLabel(e)}</th><th>Category</th><th>Role</th><th></th></tr></thead><tbody>${p.map(x=>`<tr data-participant-row><td class="select-cell"><input type="checkbox" class="participant-check" value="${safe(x.code)}" aria-label="Select ${safe(x.name)}"></td><td><code>${safe(x.code)}</code></td><td><strong>${safe(x.name)}</strong></td><td>${safe(x.group)}</td><td>${safe(x.category||'—')}</td><td>${safe(x.role||'—')}</td><td class="right"><button class="btn small danger" data-remove="${safe(x.code)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No participants yet</strong>Download the Excel template, fill it, and import it—or add delegates manually.</div>`}</div><div id="nameTagArea"></div>`;
$('#templateBtn').onclick=()=>downloadTemplate(e);$('#importBtn').onclick=()=>openImportModal(e);$('#addParticipantBtn').onclick=()=>openParticipantModal(e);$('#nameTagsBtn').onclick=()=>renderNameTags(e,p);$('#refreshParticipants').onclick=async()=>{await refreshParticipants();renderParticipants();toast('Roster refreshed.');};$$('[data-remove]',root).forEach(b=>b.onclick=()=>confirmRemoveParticipant(b.dataset.remove));const markAll=$('#markAllParticipants'),checks=$$('.participant-check',root),deleteSelected=$('#deleteSelectedParticipants');checks.forEach(c=>c.onchange=()=>updateParticipantSelection(root));if(markAll)markAll.onchange=()=>{checks.forEach(c=>c.checked=markAll.checked);updateParticipantSelection(root);};if(deleteSelected)deleteSelected.onclick=()=>confirmRemoveParticipants(selectedParticipantCodes(root));updateParticipantSelection(root);}
const EXCEL_THEME={navy:'FF0F2A55',blue:'FF1D4ED8',red:'FFDC2626',gold:'FFFACC15',white:'FFFFFFFF',ink:'FF172033',muted:'FF64748B',line:'FFD8E2EE',stripe:'FFF6F9FD',blueSoft:'FFDBEAFE',goldSoft:'FFFEF3C7',greenSoft:'FFDCFCE7',green:'FF166534'};
function excelBorder(color=EXCEL_THEME.line){return{top:{style:'thin',color:{argb:color}},left:{style:'thin',color:{argb:color}},bottom:{style:'thin',color:{argb:color}},right:{style:'thin',color:{argb:color}}};}
function styleExcelHeader(row,fill=EXCEL_THEME.blue,fontColor=EXCEL_THEME.white){row.height=30;row.eachCell({includeEmpty:true},cell=>{cell.font={name:'Aptos',size:11,bold:true,color:{argb:fontColor}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}};cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};cell.border=excelBorder('FFB8C8DC');});}

// ---------- QR generator (compact Version 3-L) ----------
const QR=(()=>{const EXP=new Array(512),LOG=new Array(256);let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;function pm(a,b){const r=new Array(a.length+b.length-1).fill(0);a.forEach((av,i)=>b.forEach((bv,j)=>r[i+j]^=mul(av,bv)));return r;}function ecc(data,n=15){let gen=[1];for(let i=0;i<n;i++)gen=pm(gen,[1,EXP[i]]);const msg=data.concat(new Array(n).fill(0));for(let i=0;i<data.length;i++){const c=msg[i];if(!c)continue;for(let j=0;j<gen.length;j++)msg[i+j]^=mul(gen[j],c);}return msg.slice(data.length);}function bp(a,v,l){for(let i=l-1;i>=0;i--)a.push((v>>>i)&1);}function md(t){const bytes=[...new TextEncoder().encode(t)];if(bytes.length>53)throw new Error('QR data too long.');const bits=[];bp(bits,4,4);bp(bits,bytes.length,8);bytes.forEach(b=>bp(bits,b,8));const cap=440;bits.push(...new Array(Math.min(4,cap-bits.length)).fill(0));while(bits.length%8)bits.push(0);const out=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];out.push(b);}let a=0;while(out.length<55)out.push(a++%2===0?0xec:0x11);return out.concat(ecc(out,15));}function bch(d){let x=d<<10,g=0x537;while((31-Math.clz32(x))>=(31-Math.clz32(g)))x^=g<<((31-Math.clz32(x))-(31-Math.clz32(g)));return((d<<10)|x)^0x5412;}function make(t){const n=29,m=Array.from({length:n},()=>Array(n).fill(null));function f(r,c){for(let y=-1;y<=7;y++)for(let z=-1;z<=7;z++){if(r+y<0||r+y>=n||c+z<0||c+z>=n)continue;m[r+y][c+z]=(y>=0&&y<=6&&z>=0&&z<=6&&(y===0||y===6||z===0||z===6||(y>=2&&y<=4&&z>=2&&z<=4)));}}f(0,0);f(n-7,0);f(0,n-7);for(let i=8;i<n-8;i++){if(m[i][6]===null)m[i][6]=i%2===0;if(m[6][i]===null)m[6][i]=i%2===0;}const ar=22,ac=22;if(m[ar][ac]===null)for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++)m[ar+r][ac+c]=Math.max(Math.abs(r),Math.abs(c))!==1;const tb=bch(8);for(let i=0;i<15;i++){const mod=((tb>>i)&1)===1;if(i<6)m[i][8]=mod;else if(i<8)m[i+1][8]=mod;else m[n-15+i][8]=mod;if(i<8)m[8][n-i-1]=mod;else if(i<9)m[8][15-i]=mod;else m[8][15-i-1]=mod;}m[n-8][8]=true;const data=md(t);let inc=-1,row=n-1,bit=7,byte=0;for(let col=n-1;col>0;col-=2){if(col===6)col--;while(true){for(let c=0;c<2;c++){const cc=col-c;if(m[row][cc]!==null)continue;let dark=byte<data.length?((data[byte]>>>bit)&1)===1:false;if((row+cc)%2===0)dark=!dark;m[row][cc]=dark;if(--bit<0){byte++;bit=7;}}row+=inc;if(row<0||row>=n){row-=inc;inc=-inc;break;}}}return m;}function svg(t,size=150){const m=make(t),q=4,n=m.length+q*2,cell=size/n;let d='';for(let r=0;r<m.length;r++)for(let c=0;c<m.length;c++)if(m[r][c])d+=`M${((c+q)*cell).toFixed(2)} ${((r+q)*cell).toFixed(2)}h${cell.toFixed(2)}v${cell.toFixed(2)}h-${cell.toFixed(2)}z`;return`<svg class="mx-auto block [image-rendering:pixelated]" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><path d="${d}" fill="black"/></svg>`;}return{svg};})();

function modal(html){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal">${html}</div></div>`;$$('[data-close]',$('#modalRoot')).forEach(b=>b.onclick=closeModal);$('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();};}
function closeModal(){$('#modalRoot').innerHTML='';}

(async function init(){try{APP.queueDb=await openQueueDb();$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)showView(b.dataset.view);});$('#scannerLaunch').addEventListener('click',openScannerSessionModal);$('#activeEventSelect').addEventListener('change',e=>setActiveEvent(e.target.value));await loadBootstrap();updateConnection();await showView(APP.currentView);}catch(err){console.error(err);$('#view-dashboard').innerHTML=`<div class="notice warning"><b>System could not initialize.</b><br>${safe(err.message)}</div>`;}})();
</script>
